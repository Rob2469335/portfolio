name: Validate portfolio

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate canonical dataset and derived files
        run: python tools/portfolio_data.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check app.js syntax
        run: node --check app.js

      - name: Fail if the working tree changed during validation
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Derived files are stale. Run: python tools/portfolio_data.py --write"
            git --no-pager diff
            exit 1
          fi
